name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp *.html _site/
          # Serve the v1 architecture doc at the site root
          cp InnoFlow-v1-architecture_draft.html _site/index.html
          # Short version URLs: /v1/ and /v2/
          mkdir -p _site/v1 _site/v2
          cp InnoFlow-v1-architecture_draft.html _site/v1/index.html
          cp InnoFlow-v2-architecture-modes.html _site/v2/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
